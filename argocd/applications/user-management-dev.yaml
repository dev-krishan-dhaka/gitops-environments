# Backend App
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dev-krishan-dhaka/platform-helm-charts
    targetRevision: HEAD
    path: charts/backend-service
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/dev-krishan-dhaka/gitops-environments/main/dev/user-management/backend-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: user-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
---
