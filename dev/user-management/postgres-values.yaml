# Dev Environment — PostgreSQL
# Not auto-updated — manual changes only

name: postgres
namespace: user-management

image:
  repository: postgres
  tag: "15-alpine"

replicas: 1
port: 5432

service:
  type: ClusterIP

pvc:
  enabled: true
  storageSize: "1Gi"
  storageClass: "local-path"

credentials:
  database: userdb
  username: postgres
  password: postgres123
  jwtSecret: myjwtsecret
