# 3-tier-app Frontend (Angular + nginx)
# Auto-updated by Jenkins CI

frontend:
  name: frontend
  image:
    repository: devkrishan001/3tier-frontend
    tag: "v1"
    pullPolicy: Always
  replicas: 2
  port: 80
  service:
    type: NodePort
    nodePort: 30091
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuThreshold: 50
  pdb:
    enabled: true
    minAvailable: 1

namespace: three-tier-app
