backend:
  name: backend
  image:
    repository: devkrishan001/3tier-backend
    tag: "v1"
    pullPolicy: Always
  replicas: 2
  port: 7777
  service:
    type: NodePort
    nodePort: 30090
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    cpuThreshold: 60
  pdb:
    enabled: true
    minAvailable: 1
  env:
    DB_HOST: mysql-service
    DB_PORT: "3306"
    DB_NAME: crud_db
    secretRef:
      name: mysql-secret
      userKey: MYSQL_ROOT_PASSWORD
      passwordKey: MYSQL_ROOT_PASSWORD

namespace: three-tier-app
